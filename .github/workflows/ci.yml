name: CI

# Triggers
#   - Push to main (excluding docs-only changes)
#   - Every pull request (excluding docs-only changes)
# Add `workflow_dispatch:` here if you want a "Run workflow" button in the UI.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".env.example"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".env.example"

jobs:
  lint-and-test:
    name: Lint + test
    runs-on: ubuntu-latest

    env:
      # tests/conftest.py overrides these for deterministic tests; defining them
      # here makes CI intent explicit and ensures `api/config.py` import
      # works for any non-test code paths.
      ODBC_DSN: ci-dummy-dsn
      API_KEY: ci-dummy-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install unixODBC and the SQLite ODBC driver
        # pyodbc needs unixODBC. The SQLite driver lets
        # tests/test_sqlite_integration.py run against a real ODBC engine;
        # every other test uses a fake driver.
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev libsqliteodbc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format --check)
        run: ruff format --check .

      - name: Run tests
        run: pytest -v
